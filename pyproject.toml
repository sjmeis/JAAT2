[build-system]
requires = ['setuptools>=42']
build-backend = 'setuptools.build_meta'

[project]
name = "jaatdev"
version = "2.0.0"
description = "JAATv2: the new and improved Job Ad Anaylsis Toolkit"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
  {name = "Stephen Meisenbacher", email = "sjmeis@gtgd.com"}
]
maintainers = [
  {name = "Stephen Meisenbacher", email = "sjmeis@gtgd.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
requires-python = ">= 3.10"
dependencies = [
    "importlib_resources",
    "nltk",
    "pandas",
    "psutil",
    "sentence_transformers>=2.7",
    "torch",
    "tqdm",
    "transformers>=4.40",
    "accelerate>=0.28.0",
    "wtpsplit",
    "rank-bm25"
]

[tool.setuptools]
packages = ["jaatdev"]
include-package-data = true

[tool.setuptools.package-data]
jaatdev = ['JAAT/data/*', 'JAAT/models/*']
