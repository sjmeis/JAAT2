[build-system]
requires = ['setuptools>=42']
build-backend = 'setuptools.build_meta'

[project]
name = "jaatdev"
version = "1.1.3"
description = "Repository for JAAT: efficient and accurate analysis of job ads for task/skill matching, title matching, firm name extraction, attribute classification, and wage extraction."
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
authors = [
  {name = "Stephen Meisenbacher", email = "sjmeis@gtgd.com"},
]
maintainers = [
  {name = "Stephen Meisenbacher", email = "sjmeis@gtgd.com"}
]
keywords = ["text analysis", "text classification", "semantic matching"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
requires-python = ">= 3.10"
dependencies = [
    "importlib_resources",
    "nltk",
    "pandas",
    "sentence_transformers>=2.7",
    "torch",
    "tqdm",
    "transformers>=4.40",
    "compress_pickle",
    "syllables",
    "pyahocorasick",
    "huggingface_hub"
]

[tool.setuptools]
packages = ["jaatdev"]
include-package-data = true

[tool.setuptools.package-data]
jaatdev = ['JAAT/data/*', 'JAAT/models/*']
